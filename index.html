<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Multi-step form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="form-container">
    <!-- Боковая панель с шагами -->
    <aside class="sidebar">
      <div class="step-indicator active" data-step="1">
        <span class="step-number">1</span>
        <div class="step-info">
          <span class="step-label">Step 1</span>
          <span class="step-title">Your info</span>
        </div>
      </div>
      <div class="step-indicator" data-step="2">
        <span class="step-number">2</span>
        <div class="step-info">
          <span class="step-label">Step 2</span>
          <span class="step-title">Select plan</span>
        </div>
      </div>
      <div class="step-indicator" data-step="3">
        <span class="step-number">3</span>
        <div class="step-info">
          <span class="step-label">Step 3</span>
          <span class="step-title">Add-ons</span>
        </div>
      </div>
      <div class="step-indicator" data-step="4">
        <span class="step-number">4</span>
        <div class="step-info">
          <span class="step-label">Step 4</span>
          <span class="step-title">Summary</span>
        </div>
      </div>
    </aside>

    <!-- Основная рабочая область формы -->
    <section class="form-content">
      <form id="multi-step-form" novalidate>
        
        <!-- STEP 1: Personal Info -->
        <fieldset class="form-step" id="step-1">
          <div class="step-header">
            <h1 class="step-heading">Personal info</h1>
            <p class="step-description">Please provide your name, email address, and phone number.</p>
          </div>

          <div class="input-group">
            <div class="label-wrapper">
              <label for="user-name">Name</label>
              <span class="error-message" id="error-name"></span>
            </div>
            <input type="text" id="user-name" placeholder="e.g. Stephen King" autocomplete="name">
          </div>

          <div class="input-group">
            <div class="label-wrapper">
              <label for="user-email">Email Address</label>
              <span class="error-message" id="error-email"></span>
            </div>
            <input type="email" id="user-email" placeholder="e.g. stephenking@lorem.com" autocomplete="email">
          </div>

          <div class="input-group">
            <div class="label-wrapper">
              <label for="user-phone">Phone Number</label>
              <span class="error-message" id="error-phone"></span>
            </div>
            <input type="tel" id="user-phone" placeholder="e.g. +1 234 567 890" autocomplete="tel">
          </div>
        </fieldset>

        <!-- STEP 2: Select Plan -->
        <fieldset class="form-step" id="step-2">
          <div class="step-header">
            <h1 class="step-heading">Select your plan</h1>
            <p class="step-description">You have the option of monthly or yearly billing.</p>
          </div>

          <div class="plans-container">
            <!-- Arcade Card -->
            <label class="plan-card selected" for="plan-arcade">
              <input type="radio" name="plan" id="plan-arcade" value="arcade" checked>
              <img src="./assets/images/icon-arcade.svg" alt="Arcade plan icon" class="plan-icon">
              <div class="plan-details">
                <span class="plan-name">Arcade</span>
                <span class="plan-price" data-monthly="$9/mo" data-yearly="$90/yr">$9/mo</span>
                <span class="plan-bonus hidden">2 months free</span>
              </div>
            </label>

            <!-- Advanced Card -->
            <label class="plan-card" for="plan-advanced">
              <input type="radio" name="plan" id="plan-advanced" value="advanced">
              <img src="./assets/images/icon-advanced.svg" alt="Advanced plan icon" class="plan-icon">
              <div class="plan-details">
                <span class="plan-name">Advanced</span>
                <span class="plan-price" data-monthly="$12/mo" data-yearly="$120/yr">$12/mo</span>
                <span class="plan-bonus hidden">2 months free</span>
              </div>
            </label>

            <!-- Pro Card -->
            <label class="plan-card" for="plan-pro">
              <input type="radio" name="plan" id="plan-pro" value="pro">
              <img src="./assets/images/icon-pro.svg" alt="Pro plan icon" class="plan-icon">
              <div class="plan-details">
                <span class="plan-name">Pro</span>
                <span class="plan-price" data-monthly="$15/mo" data-yearly="$150/yr">$15/mo</span>
                <span class="plan-bonus hidden">2 months free</span>
              </div>
            </label>
          </div>

          <!-- Billing Toggle (Monthly / Yearly) -->
          <div class="billing-toggle-container">
            <span class="billing-period active" id="monthly-label">Monthly</span>
            <label class="toggle-switch" for="billing-checkbox">
              <input type="checkbox" id="billing-checkbox" aria-label="Toggle billing duration">
              <span class="toggle-slider"></span>
            </label>
            <span class="billing-period" id="yearly-label">Yearly</span>
          </div>
        </fieldset>

        <!-- STEP 3: Add-ons -->
        <fieldset class="form-step active" id="step-3">
          <div class="step-header">
            <h1 class="step-heading">Pick add-ons</h1>
            <p class="step-description">Add-ons help enhance your gaming experience.</p>
          </div>

          <div class="addons-container">
            <!-- Addon 1: Online service -->
            <label class="addon-card selected" for="addon-online">
              <input type="checkbox" id="addon-online" class="addon-checkbox" checked>
              <span class="custom-checkbox"></span>
              <div class="addon-details">
                <span class="addon-name">Online service</span>
                <span class="addon-desc">Access to multiplayer games</span>
              </div>
              <span class="addon-price" data-monthly="+$1/mo" data-yearly="+$10/yr">+$1/mo</span>
            </label>

            <!-- Addon 2: Larger storage -->
            <label class="addon-card selected" for="addon-storage">
              <input type="checkbox" id="addon-storage" class="addon-checkbox" checked>
              <span class="custom-checkbox"></span>
              <div class="addon-details">
                <span class="addon-name">Larger storage</span>
                <span class="addon-desc">Extra 1TB of cloud save</span>
              </div>
              <span class="addon-price" data-monthly="+$2/mo" data-yearly="+$20/yr">+$2/mo</span>
            </label>

            <!-- Addon 3: Customizable Profile -->
            <label class="addon-card" for="addon-profile">
              <input type="checkbox" id="addon-profile" class="addon-checkbox">
              <span class="custom-checkbox"></span>
              <div class="addon-details">
                <span class="addon-name">Customizable Profile</span>
                <span class="addon-desc">Custom theme on your profile</span>
              </div>
              <span class="addon-price" data-monthly="+$2/mo" data-yearly="+$20/yr">+$2/mo</span>
            </label>
          </div>
        </fieldset>

        <!-- Кнопки управления -->
        <div class="form-navigation">
          <button type="button" class="btn btn-back hidden" id="btn-back">Go Back</button>
          <button type="button" class="btn btn-next" id="btn-next">Next Step</button>
        </div>

      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
